[project]
name = "chora-closure-orchestrator"
version = "0.2.0"
description = "Chora Closure Orchestrator — Python LangGraph federated saga (Tier 3 D11; Tier 2 D5 hybrid kernel)"
requires-python = ">=3.13"
authors = [
    { name = "Chora Platform Team (Team 3)" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "grpcio>=1.66",
    "grpcio-tools>=1.66",
    "protobuf>=5.28",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
    "uuid7>=0.1.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    # NATS JetStream — the local, cloud-neutral message bus that replaces
    # Google Cloud Pub/Sub. The outbox dispatcher publishes closure events
    # through it (adapter/pubsub/publisher.py) and the per-domain ack
    # consumers subscribe through it (wiring.py).
    "nats-py>=2.6.0",
    # MinIO — the local, cloud-neutral object store that replaces Google
    # Cloud Storage for the cold-archive write path
    # (adapter/coldarchive/minio.py). The gs:// URI scheme is retained as
    # the canonical object reference; the adapter translates it to a
    # MinIO bucket/key.
    "minio>=7.2.0",
    # AES-256-GCM envelope encryption for the local KMS adapter
    # (adapter/kms/local.py): per-user DEKs wrapped by the CHORA_LOCAL_KEK
    # master key from the environment — the cloud-neutral replacement for
    # Cloud KMS. Crypto-shred semantics are unchanged.
    "cryptography>=43.0",
    # chora_contracts_gen (the generated Protobuf stubs for the closure
    # saga lifecycle events) is VENDORED under src/chora_contracts_gen —
    # chora-contracts is not published to PyPI, and the standalone repo
    # must not reference sibling checkouts. protomarshal re-encodes the
    # outbox JSON body to canonical Protobuf binary at publish time.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.32",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "coverage>=7.6",
    "pyyaml>=6.0",
]

[project.scripts]
chora-closure-orchestrator = "chora_closure_orchestrator.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chora_closure_orchestrator", "src/chora_contracts_gen"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]
# Vendored generated Protobuf stubs (chora_contracts_gen) — excluded from
# ALL linting: long serialized descriptor lines, utf-8 coding comments,
# and imports that exist only for their descriptor-registration side effect.
extend-exclude = ["src/chora_contracts_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "T20", "ASYNC"]
# B008: FastAPI Depends() in defaults is idiomatic.
# N818: the domain error types use the deliberate ``Err*`` prefix
# (mirroring Go error naming) rather than an ``Error`` suffix.
ignore = ["B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
files = ["src/chora_closure_orchestrator", "tests"]
exclude = "(chora_contracts_gen)\\.py$"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "uuid7",
    "grpc.*",
    "google.protobuf.*",
    "yaml",
    "nats.*",
    "minio.*",
]
ignore_missing_imports = true

# The chora_contracts_gen bindings are generated by buf and ship without a
# py.typed marker, so mypy cannot type them. They are consumed dynamically
# (see adapter/pubsub/protomarshal.py).
[[tool.mypy.overrides]]
module = ["chora_contracts_gen.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -q"
markers = [
    "unit: fast in-process unit tests",
    "integration: end-to-end saga happy path + cancel + compensation",
]

[tool.coverage.run]
source = [
    "src/chora_closure_orchestrator/domain",
    "src/chora_closure_orchestrator/orchestrators",
    "src/chora_closure_orchestrator/adapter/events",
    "src/chora_closure_orchestrator/adapter/kms",
    "src/chora_closure_orchestrator/adapter/coldarchive",
    "src/chora_closure_orchestrator/adapter/repository",
    "src/chora_closure_orchestrator/adapter/pii_map",
]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
